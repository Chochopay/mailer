<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Рассылка</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0e0e0e;
      color: #ececec;
      font: 16px/1.5 ui-sans-serif, system-ui, sans-serif;
    }
    main { width: min(420px, calc(100% - 32px)); }
    h1 { font-size: 1.25rem; font-weight: 560; margin: 0 0 8px; }
    .lead { margin: 0 0 24px; color: #9a9a9a; }
    form { display: grid; gap: 12px; }
    input, button {
      font: inherit;
      border-radius: 8px;
      padding: 12px 14px;
    }
    input {
      background: #161616;
      color: inherit;
      border: 1px solid #2c2c2c;
    }
    input:focus { outline: 1px solid #8a8a8a; }
    button {
      background: #f2f2f2;
      color: #111;
      border: 0;
      cursor: pointer;
    }
    button:disabled { opacity: 0.55; cursor: default; }
    .status { min-height: 1.5em; margin: 16px 0 0; color: #bdbdbd; }
    .status.error { color: #e08b8b; }
  </style>
</head>
<body>
  <main>
    <h1>Рассылка</h1>
    <p class="lead">Оставьте email — пришлём готовое письмо.</p>
    <form id="form">
      <input type="email" name="email" required placeholder="you@example.com" autocomplete="email">
      <button type="submit">Отправить</button>
    </form>
    <p class="status" id="status" role="status"></p>
  </main>
  <script>
    const form = document.getElementById("form");
    const status = document.getElementById("status");
    const button = form.querySelector("button");

    function csrfToken() {
      const match = document.cookie.match(/(?:^|; )csrftoken=([^;]+)/);
      return match ? decodeURIComponent(match[1]) : "";
    }

    function messageFrom(payload) {
      if (!payload) return "Не удалось отправить письмо.";
      if (payload.email) return payload.email[0];
      if (payload.detail) return payload.detail;
      return "Не удалось отправить письмо.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "";
      status.classList.remove("error");
      button.disabled = true;

      try {
        const response = await fetch("/api/send/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfToken(),
          },
          body: JSON.stringify({ email: new FormData(form).get("email") }),
        });
        const payload = await response.json().catch(() => null);
        status.textContent = messageFrom(payload);
        status.classList.toggle("error", !response.ok);
        if (response.ok) form.reset();
      } catch {
        status.textContent = "Нет связи с сервером.";
        status.classList.add("error");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
